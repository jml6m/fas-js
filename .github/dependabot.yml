# Dependabot: security updates only.
#
# Version updates are taken once per release, in one pull request into the release integration
# branch, so every upgrade is reviewed and tested with the release it ships in. A version-update
# pull request opened by Dependabot would target the default branch, which only takes release
# pull requests, so it could never merge.
#
# Major upgrades of eslint, @eslint/js, typescript, typescript-eslint, mocha, chai and cross-env
# are held: each needs its own issue.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # 0 turns version updates off. Security updates are not affected by this limit.
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
