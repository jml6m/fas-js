name: Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts: install the dependency tree for auditing without
      # running postinstall/native builds/husky. The gate hard-fails on
      # critical/high in PRODUCTION deps (dev-only advisories are reported but
      # not gated); since CI is set, offline/registry errors fail rather than skip.
      - run: npm ci --ignore-scripts
      - run: npm run audit:ci
