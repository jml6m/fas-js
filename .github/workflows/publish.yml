name: Publish to npm

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Fail-closed publish guard: only a v*.*.* tag push may publish, and the tag
      # must equal package.json's version. Blocks the v1.7.0-class mismatch (tag and
      # manifest disagree) and the workflow_dispatch path silently publishing a branch.
      - name: Verify tag matches package.json version
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Publish must be triggered by a v*.*.* tag push, not ${GITHUB_EVENT_NAME} ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'."
            exit 1
          fi
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${PKG_VER}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package.json version 'v${PKG_VER}'."
            exit 1
          fi
          echo "OK: publishing v${PKG_VER} from tag ${GITHUB_REF_NAME}."
      # Fail-closed: tag must point at a commit on master (blocks stray/off-master tags
      # like the v1.9.0 local-tag footgun — see #328).
      - name: Verify tag commit is on master
        run: |
          # Deepen history: default checkout is shallow; merge-base --is-ancestor
          # needs enough master history when the tag is not the tip (#359 review).
          git fetch --no-tags --prune --unshallow origin master 2>/dev/null \
            || git fetch --no-tags --prune --depth=1000 origin master
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Tag commit ${GITHUB_SHA} is not on origin/master. Refusing to publish a stray/off-master tag."
            echo "Tip: git fetch origin master && git tag -f vX.Y.Z origin/master  # only before first push; never retag after publish"
            exit 1
          fi
          MASTER_SHA="$(git rev-parse origin/master)"
          if [ "${GITHUB_SHA}" = "${MASTER_SHA}" ]; then
            echo "OK: tag ${GITHUB_REF_NAME} points at master tip ${MASTER_SHA}."
          else
            echo "OK: tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is an ancestor of master tip ${MASTER_SHA}."
          fi
      # Use recent npm for OIDC provenance support (see ci.yml for rationale).
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # Build before the security gate: check:security -> check-public-api.mjs
      # reads lib/index.d.ts, so the artifact must exist first.
      - run: node scripts/check-package-scripts.mjs
      - run: npm run build
      - run: npm run check:security
      # Hard gate: dead code / unused files must not ship. Non-blocking in CI
      # (a warning on integration PRs), fatal here at publish. See issue #309.
      - run: npm run health:dead:strict
      - run: npm publish --provenance --access public
