name: PR Issue Link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  # Writes are only for the milestone/comment follow-up below; the gate itself only reads.
  # Setting a PR's milestone 403s with issues: write alone, so pull-requests needs write too.
  issues: write
  pull-requests: write

concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;

            // Carve-outs return early (exit 0). The job must never be skipped with a
            // job-level `if:` — a required context that never reports leaves the PR
            // pending forever, which is what sank earlier attempts at this.
            if (pr.user.login === 'dependabot[bot]') {
              core.info('Dependabot PR — gate does not apply.');
              return;
            }

            const refRegex = /^\s*(?:relates?\s+to|close[sd]?|fix(?:es|ed)?|resolve[sd]?)\s+#(\d+)\b/gim;
            const refs = [...new Set([...(pr.body || '').matchAll(refRegex)].map((m) => Number(m[1])))];

            const fail = async (lines) => {
              const msg = lines.join('\n');
              await core.summary.addRaw(`${msg}\n`).write();
              core.setFailed(msg);
            };

            if (refs.length === 0) {
              return fail([
                'This PR does not link an issue.',
                '',
                'Add a line to the PR description starting with one of:',
                '  Relates to #123   (default - does not auto-close)',
                '  Closes #123 / Fixes #123 / Resolves #123',
                '',
                'The line must START with the keyword. "part of #123" in prose does not count.',
              ]);
            }

            const problems = [];
            const passed = [];

            for (const number of refs) {
              let issue;
              try {
                issue = (await github.rest.issues.get({ ...context.repo, issue_number: number })).data;
              } catch (error) {
                problems.push(
                  error.status === 404
                    ? `#${number}: no such issue in this repo.`
                    : `#${number}: lookup failed (${error.status}).`
                );
                continue;
              }
              if (issue.pull_request) {
                problems.push(`#${number}: that is a pull request, not an issue.`);
              } else if (issue.state !== 'open') {
                problems.push(`#${number}: closed - link the issue this work is actually for.`);
              } else if (!issue.milestone) {
                problems.push(`#${number}: no milestone - slot it into a release before opening a PR for it.`);
              } else {
                core.info(`#${number} OK - open, milestone "${issue.milestone.title}".`);
                passed.push({ number, milestone: issue.milestone });
              }
            }

            if (passed.length === 0) {
              return fail(['No linked issue satisfies the gate.', '', ...problems.map((p) => `  ${p}`)]);
            }
            for (const p of problems) core.warning(p);
            core.info(`${passed.length} linked issue(s) satisfied the gate.`);

            // Give the PR its linked issues' milestone. Best effort: nothing below may change
            // the check's result, so failures (e.g. a fork PR's read-only token) only warn.
            if (pr.milestone) {
              core.info(`PR already has milestone "${pr.milestone.title}" - leaving it.`);
              return;
            }
            const milestones = new Map(passed.map((p) => [p.milestone.number, p.milestone]));
            if (milestones.size === 1) {
              const [milestone] = milestones.values();
              try {
                await github.rest.issues.update({ ...context.repo, issue_number: pr.number, milestone: milestone.number });
                core.info(`Set PR milestone to "${milestone.title}".`);
              } catch (error) {
                core.warning(`Could not set PR milestone "${milestone.title}" (${error.status ?? error.message}).`);
              }
              return;
            }

            const marker = '<!-- issue-link-milestone -->';
            core.warning('Linked issues are in different milestones - no PR milestone set.');
            try {
              const pages = github.paginate.iterator(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              for await (const { data } of pages) {
                if (data.some((c) => (c.body || '').includes(marker))) {
                  core.info('Milestone comment already posted - leaving it.');
                  return;
                }
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: [
                  marker,
                  'The linked issues are in different milestones, so no milestone was set on this PR:',
                  '',
                  ...passed.map((p) => `- #${p.number}: ${p.milestone.title}`),
                  '',
                  'Set the PR milestone by hand.',
                ].join('\n'),
              });
            } catch (error) {
              core.warning(`Could not post the milestone comment (${error.status ?? error.message}).`);
            }
