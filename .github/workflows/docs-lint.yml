name: Docs Lint

on:
  pull_request:
    # Run when docs change, and also when commonly linked targets (like workflow files)
    # change so lychee can catch broken in-repo links after renames/deletes.
    paths:
      - '**/*.md'
      - '.lychee.toml'
      - '.markdownlint-cli2.yaml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - 'scripts/check-agent-file-length.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Fragments via include_fragments = "full" in .lychee.toml — no CLI flag.
          # lycheeVersion pinned so config syntax cannot drift with the action tag.
          args: --no-progress --config ./.lychee.toml './**/*.md'
          lycheeVersion: v0.24.2
          fail: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.14.0

      - name: Run markdownlint
        run: markdownlint-cli2 '**/*.md'

      - name: Agent-instruction file length
        run: node scripts/check-agent-file-length.mjs
