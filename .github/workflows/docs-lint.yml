name: Docs Lint

on:
  pull_request:
    # Run when docs change, and also when commonly linked targets (like workflow files)
    # change so lychee can catch broken in-repo links after renames/deletes.
    paths:
      - '**/*.md'
      - '.lychee.toml'
      - '.markdownlint-cli2.yaml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --include-fragments --config ./.lychee.toml './**/*.md'
          fail: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.14.0

      - name: Run markdownlint
        run: markdownlint-cli2 '**/*.md'
