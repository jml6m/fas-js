name: Auto-Link Issue

# Not a ruleset-required check — run manually when a branch is named N-*.
on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: PR number
        required: true
        type: string

permissions:
  contents: read

jobs:
  link-issue:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PULL_NUMBER: ${{ inputs.pull_number }}
        with:
          script: |
            const pull_number = Number(process.env.PULL_NUMBER);
            if (!Number.isFinite(pull_number) || pull_number <= 0) {
              core.setFailed(`Invalid pull_number: ${process.env.PULL_NUMBER}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            if (pr.head.repo.full_name !== pr.base.repo.full_name) {
              console.log('Fork PR — skip auto-link.');
              return;
            }
            const match = pr.head.ref.match(/^(\d+)-/);
            if (!match) {
              console.log('Branch does not start with N- — nothing to link.');
              return;
            }
            const linkText = `Closes #${match[1]}`;
            const prBody = pr.body || '';
            if (/\b(closes|fixes|resolves)\s+#\d+\b/i.test(prBody)) {
              console.log('PR already has a closing reference.');
              return;
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              body: `${linkText}\n\n${prBody}`,
            });
            console.log(`Linked ${linkText}`);
