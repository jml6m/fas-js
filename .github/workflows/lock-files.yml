name: Lock Files

# The lock: files listed in .github/PROTECTED_FILES.json cannot change on the default branch.
# This check fails every pull request into it that touches one, and no label or approval turns
# it green. Pull requests into other branches are not checked; a protected file changed there
# surfaces when the release pull request reaches the default branch.
#
# The one way through is the exception process, run by the maintainer: accept the change, add
# the `locked-files-changed` label, turn the lock off, merge that pull request and nothing else,
# and turn the lock back on. The label is only for pull requests into the default branch:
# `pr-hygiene` fails any other pull request that carries it.
#
# The lock must be turned back on BEFORE the next release. The Release workflow checks it, in a
# dry run too, and fails while the lock is off.

on:
  pull_request:
    # edited: the base branch may have changed to the default branch.
    # labeled, unlabeled: the report says whether `locked-files-changed` is present.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: lock-files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Fetch base commit
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Check protected files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-protected-files.mjs
