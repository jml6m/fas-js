name: CI

# Checks: static-gates, test (<node>), and tests-passed, which summarises every
# matrix leg under one name that doesn't change with the matrix.
# on.pull_request only (no on.push) so each PR gets one CI run, not a second run
# from pushes to the head branch.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Environment-independent gates: once per PR (not per Node version).
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: node scripts/check-package-scripts.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: node scripts/check-guard-tests.mjs
      - run: node scripts/check-public-api.mjs
      - run: node scripts/check-npm-pack.mjs
      - name: Dead-code check (warn)
        run: npm run health:dead || echo "::warning::knip reported dead code or unused files (see log); this is non-blocking on PRs but blocks publish."

  # Required: test (22), test (24)
  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: node scripts/check-package-scripts.mjs
      - run: npm run build
      - name: Run tests with coverage
        run: npx cross-env NODE_OPTIONS=--import=tsx c8 mocha "test/**/*.spec.js"
      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Matrix-independent summary of every test leg; this is the check to require.
  # always() so a failed leg reports as a failure here instead of skipping it.
  tests-passed:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test.result }}" = "success" ]'
