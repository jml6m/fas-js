name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - master
      - 'chore/v*'
      - 'chore/v*-*'
      - 'v*'
      - 'v*-*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Upgrade npm only on Node 20+ (npm 11 requires Node ^20.17 || >=22.9;
      # Node 18 ships npm 10, which is sufficient for the test path).
      - name: Upgrade npm (Node 20+ only)
        if: matrix.node != '18'
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - name: Upload coverage to Codecov
        if: matrix.node == 20
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      # Upgrade npm for consistent behavior (Node 20 ships npm 10 which has
      # OIDC/trusted publish limitations; same upgrade used in publish path).
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:security