name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - master
      - 'chore/v*.*-*'
      - 'chore/v*-*'
      - 'v*.*-*'
      - 'v*-*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Environment-independent gates: run exactly once per PR (not per Node version).
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: node scripts/check-package-scripts.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: node scripts/check-guard-tests.mjs
      - run: node scripts/check-public-api.mjs
      - run: node scripts/check-npm-pack.mjs
      - name: Dead-code check (warn)
        run: npm run health:dead || echo "::warning::knip reported dead code or unused files (see log); this is non-blocking on PRs but blocks publish."

  # Runtime tests — required ruleset context remains `test (22)`; matrix also runs 24.
  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: node scripts/check-package-scripts.mjs
      - run: npm run build
      - name: Run tests with coverage
        run: npx cross-env NODE_OPTIONS=--import=tsx c8 mocha "test/**/*.spec.js"
      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
