<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finite Automaton Simulator — fas-js</title>
    <meta
      name="description"
      content="Pick a DFA or an NFA, or paste your own, then run an input or step through it and watch the graph."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app" data-view="run">
      <header class="top">
        <div class="top__text">
          <h1>Finite Automaton Simulator</h1>
          <p class="top__note">
            Runs <span id="lib-version">fas-js</span> in your browser.
            <a href="v1/">Open the original 2019 simulator</a>
          </p>
        </div>
        <div class="views" role="group" aria-label="Panel shown">
          <button type="button" class="views__btn" id="view-machine" aria-pressed="false">Machine</button>
          <button type="button" class="views__btn" id="view-run" aria-pressed="true">Run</button>
        </div>
      </header>

      <main class="panels">
        <section class="panel panel--machine" aria-labelledby="machine-heading">
          <h2 id="machine-heading">Machine</h2>

          <div class="machine">
            <div class="machine__pick">
              <div class="field">
                <label for="preset">Choose a machine</label>
                <select id="preset" aria-describedby="about"></select>
                <p class="about" id="about"></p>
              </div>
            </div>

            <div class="field field--grow">
              <label for="definition">Definition</label>
              <p class="hint" id="definition-hint">
                Edit this JSON or paste your own, then choose Load. The text may also be the DOT text that
                <code>generateDigraph()</code> returns.
              </p>
              <textarea
                id="definition"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
                aria-describedby="definition-hint load-error"
              ></textarea>
            </div>

            <div class="machine__actions">
              <div class="row row--buttons">
                <button type="button" class="btn btn--primary" id="load">Load</button>
                <button type="button" class="btn" id="copy-dot">Copy as DOT</button>
              </div>
              <p class="note" id="load-status" role="status" hidden></p>
              <p class="error" id="load-error" role="alert" hidden></p>
            </div>
          </div>
        </section>

        <section class="panel panel--run" aria-labelledby="run-heading">
          <h2 id="run-heading">Run</h2>

          <div class="run">
            <div class="graph" id="graph" role="group" aria-label="Graph" tabindex="-1">
              <p class="placeholder">The graph is drawn here.</p>
            </div>

            <div class="run__controls">
              <p class="note" id="summary" hidden></p>

              <p class="status" id="status" role="status">
                <span id="step-message"></span>
                <strong class="verdict" id="result" aria-hidden="true"></strong>
                <span class="visually-hidden" id="result-words"></span>
              </p>

              <div class="field">
                <label for="input">Input <span class="label__rule" id="input-rule"></span></label>
                <input
                  id="input"
                  type="text"
                  autocomplete="off"
                  autocapitalize="off"
                  spellcheck="false"
                  aria-describedby="input-hint input-error"
                />
                <p class="hint" id="input-hint"></p>
                <p class="error" id="input-error" role="alert" hidden></p>
              </div>

              <ol class="tape" id="tape" aria-label="Symbols of the input"></ol>

              <div class="row row--buttons">
                <button type="button" class="btn btn--primary" id="simulate">Simulate</button>
                <button type="button" class="btn" id="step">Step</button>
                <button type="button" class="btn" id="reset" disabled>Reset</button>
                <label class="check"><input type="checkbox" id="show-steps" /> Show all steps</label>
              </div>

              <ol class="steps" id="steps" aria-label="All steps of this run" tabindex="0" hidden></ol>
            </div>
          </div>
        </section>
      </main>

      <footer class="foot">
        <a href="https://github.com/jml6m/fas-js">fas-js on GitHub</a>
        <a href="vendor/NOTICE.txt">Third-party notices</a>
      </footer>
    </div>

    <script src="./vendor/fas-js.bundle.js"></script>
    <script src="./vendor/build-info.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
